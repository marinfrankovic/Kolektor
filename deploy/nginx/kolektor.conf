# OPTIONAL. Only needed if you want a custom domain and HTTPS in front of Kolektor.
# Skip this file entirely to keep the app on http://<host>:8100 inside your LAN.
#
# Install:
#   cp kolektor.conf /etc/nginx/sites-available/kolektor.conf
#   ln -s ../sites-available/kolektor.conf /etc/nginx/sites-enabled/kolektor.conf
#   nginx -t && systemctl reload nginx
#
# Then set in your .env and recreate the app container:
#   KOLEKTOR_BEHIND_PROXY=true
#   KOLEKTOR_COOKIE_SECURE=true
#   KOLEKTOR_PUBLIC_BASE_URL=https://kolektor.example.com

server {
    listen 80;
    server_name kolektor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name kolektor.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Phone photos are large; the app enforces its own limit as well.
    client_max_body_size 64m;

    # If nginx runs in a container on the same Docker network as Kolektor, keep the
    # resolver and the variable below: nginx otherwise caches the upstream IP at
    # startup and breaks the first time the app container is recreated.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $kolektor_upstream kolektor-app;

    location / {
        proxy_pass http://$kolektor_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
